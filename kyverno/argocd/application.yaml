apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  source:
    repoURL: 'https://github.com/jjchange10/kyverno-practice'
    targetRevision: main
    path: application/kyverno/overlays
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
