apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argocd
spec:
  destination:
    server: "https://kubernetes.default.svc"
    namespace: platform
  project: app-of-apps
  source:
    path: kyverno/applications
    repoURL: https://github.com/jjchange10/kyverno-practice.git
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
