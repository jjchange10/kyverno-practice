    - '[Event,*,*]'
    - '[*,kube-system,*]'
    - '[*/*,kube-public,*]'
    - '[*/*,kube-node-lease,*]'
    - '[Node,*,*]'
    - '[Node/?*,*,*]'
    - '[APIService,*,*]'
    - '[APIService/?*,*,*]'
    - '[TokenReview,*,*]'
    - '[SubjectAccessReview,*,*]'
    - '[SelfSubjectAccessReview,*,*]'
    - '[Binding,*,*]'
    - '[Pod/binding,*,*]'
    - '[ReplicaSet,*,*]'
    - '[ReplicaSet/?*,*,*]'
    - '[EphemeralReport,*,*]'
    - '[ClusterEphemeralReport,*,*]'
