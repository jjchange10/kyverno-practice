apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  sources:
    - repoURL: "https://kyverno.github.io/kyverno/"
      chart: kyverno
      targetRevision: 3.6.0
      helm:
        releaseName: kyverno-apps
        valueFiles:
          - $repo/kyverno/helm/values.yaml
    - repoURL: https://github.com/jjchange10/kyverno-practice.git
      targetRevision: main
      ref: repo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
